name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  compile-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generator is intentionally skipped: it requires local
      # Minecraft client data (BEDROCK_PATH / MINECRAFT_DATA_PATH).
      - name: Compile schemas
        run: bun run compile

      - name: Package dist
        run: |
          ls -la dist
          tar -czf schemas.tar.gz dist package.json

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: schemas.tar.gz
